name: Build and Auto Release Amon APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: 🏷️ Detect App Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "APP_VERSION=v$VERSION_NAME" >> $GITHUB_ENV
          echo "Detected Version: v$VERSION_NAME"

      - name: 🔨 Build Debug APK
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare Clean Amon.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Amon.apk

      - name: 🚀 Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Amon ${{ env.APP_VERSION }}"
          body: "✨ Automatic build & update for Amon. Download Amon.apk below."
          draft: false
          prerelease: false
          files: Amon.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
