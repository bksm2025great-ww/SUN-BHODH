name: Build Amon APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 🔑 रोबोट को Releases काउंटर पर नया वर्ज़न पब्लिश करने की अनुमति देना
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/amon.jks

      - name: Build Signed Release APK
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/amon.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 📦 1. अंदरूनी स्टोर रूम में APK सुरक्षित रखना (पुराना तरीक़ा)
      - name: Upload Signed APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Amon-Release-APK
          path: app/build/outputs/apk/release/*.apk

      # 🔍 2. build.gradle.kts से ताज़ा वर्ज़न (जैसे 1.0.7) अपने-आप पढ़ना
      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | cut -d '"' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected Version: $VERSION"

      # 🚀 3. GitHub Releases काउंटर पर सीधे पब्लिश करना (ताकि फ़ोन में तुरंत अपडेट दिखे)
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Amon v${{ env.APP_VERSION }}"
          body: |
            ✨ Amon Auto Update v${{ env.APP_VERSION }}
            - Focus & Garden system updates
            - 120Hz display optimizations & stability fixes
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
